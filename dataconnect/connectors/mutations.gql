mutation CreateSkill(
  $title: String!
  $description: String!
  $tags: [String!]!
  $installCommand: String!
  $promptConfig: String!
  $usageExample: String!
) @auth(level: USER) {
  skill_insert(
    data: {
      authorClerkId_expr: "auth.uid"
      title: $title
      description: $description
      tags: $tags
      installCommand: $installCommand
      promptConfig: $promptConfig
      usageExample: $usageExample
    }
  )
}
